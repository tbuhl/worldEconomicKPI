[project]
name = "world-kpi-radar"
version = "0.1.0"
description = "A live, historically calibrated world-economy and AI-capex risk dashboard"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.42,<2",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "plotly>=5.24,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1", "playwright>=1.51,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
